version: '3.8'

services:
  abarso-ai:
    build: .
    container_name: abarso-ai-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./baileys_auth_info:/app/baileys_auth_info
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

